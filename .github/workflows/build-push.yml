# Build the image, prove it works, then push it to Docker Hub.
#
# The verify step is not ceremony. Most of what this image adds -- the rtk
# shims, the stripped setuid bits, the promise that no runtime env is baked in
# -- fails *silently*: a shim that falls through to the unfiltered binary and a
# working shim look identical from the outside. So the amd64 image is built and
# loaded first, `make verify` runs against it, and only then does anything get
# pushed.
name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only edits do not change the image.
    #
    # Caveat that matters now that a git tag is the release mechanism: GitHub
    # evaluates these filters for tag pushes too, against the tagged commit.
    # Tagging a commit that only touched a .md file therefore builds nothing.
    # Tag a commit that touches the image, or run this workflow manually
    # against the tag ref -- the dispatch path below handles that case.
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      shim_level:
        description: "rtk shim level to build"
        type: choice
        options: [safe, aggressive, none]
        default: safe
      platforms:
        description: "Target platforms"
        default: linux/amd64
      base_tag:
        description: "Upstream hermes-agent tag to build on (blank = the git tag when run on one, else latest)"
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # NOTE: DOCKERHUB_REPOSITORY is set on the `build` job, not here. Secrets and
  # Variables are two separate stores, and the `secrets` context is not
  # available to workflow-level `env` -- only job-level. Reading both requires
  # being inside a job.

  # amd64 only by default -- it is what the VPS runs and what the image is
  # tested on. arm64 works (install-rtk.sh handles it and the base is
  # multi-arch), but it is QEMU-emulated here, so opt in via workflow_dispatch
  # or by changing this rather than paying for it on every push.
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
  SHIM_LEVEL: ${{ inputs.shim_level || 'safe' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate the compose file
        run: |
          # compose interpolates from .env; without it HERMES_BIND_ADDR is
          # empty and the port mapping is malformed, which is a config error
          # rather than the syntax error we are actually looking for here.
          cp .env.example .env
          docker compose config --quiet
          echo "compose: OK"

      - name: Fail if the image bakes runtime env
        run: |
          # The Dockerfile is meant to declare no ENV at all -- every runtime
          # variable comes from compose.yaml and .env. Catch a regression here,
          # where the diff is still in front of a reviewer.
          if grep -qE '^[[:space:]]*ENV[[:space:]]' Dockerfile; then
            echo "::error file=Dockerfile::Dockerfile declares ENV; runtime configuration belongs in compose.yaml"
            grep -nE '^[[:space:]]*ENV[[:space:]]' Dockerfile
            exit 1
          fi
          echo "no ENV in Dockerfile: OK"

  build:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Where the image is pushed, read from EITHER store. GitHub keeps
      # Variables and Secrets in separate namespaces: `vars.X` cannot see a
      # value set in the Secrets tab and vice versa, so a workflow that reads
      # only one of them fails with "not set" for a value the operator can see
      # sitting right there in the UI. Accept both and let placement be a
      # preference rather than a trap.
      #
      # A Variable is still the better home -- see the warning in the step
      # below -- but a Secret works.
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY }}
      # Only used to tell the two sources apart for that warning.
      DOCKERHUB_REPOSITORY_FROM_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the push configuration is complete
        # Every value the push needs is checked here, before the build, because
        # the alternative is what it replaced: a ten-minute build followed by
        # `Error: Username and password required` from the login action, which
        # names neither the missing setting nor where to put it.
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "${DOCKERHUB_REPOSITORY}" ] || missing="${missing} DOCKERHUB_REPOSITORY"
          [ -n "${DOCKERHUB_USERNAME}" ]   || missing="${missing} DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN}" ]      || missing="${missing} DOCKERHUB_TOKEN"

          if [ -n "${missing}" ]; then
            echo "::error::Not set:${missing}. Add them under Settings -> Secrets and variables -> Actions. DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be in the *Secrets* tab (they are credentials); DOCKERHUB_REPOSITORY may be in either tab. The two tabs are separate namespaces -- a value in one is invisible to the other -- and a secret defined on an *Environment* rather than the repository is invisible unless the job declares that environment."
            echo ""
            echo "Present:"
            echo "  DOCKERHUB_REPOSITORY : $([ -n "${DOCKERHUB_REPOSITORY}" ] && echo yes || echo NO)"
            echo "  DOCKERHUB_USERNAME   : $([ -n "${DOCKERHUB_USERNAME}" ] && echo yes || echo NO)"
            echo "  DOCKERHUB_TOKEN      : $([ -n "${DOCKERHUB_TOKEN}" ] && echo yes || echo NO)"
            exit 1
          fi

          # A Docker Hub access token starts with dckr_pat_. An account password
          # here would fail at login with 2FA enabled, and the login action's
          # error does not distinguish the two cases.
          case "${DOCKERHUB_TOKEN}" in
            dckr_pat_*|dckr_oat_*) ;;
            *) echo "::warning::DOCKERHUB_TOKEN does not look like a Docker Hub access token (expected a dckr_pat_ prefix). If this is an account password it will fail when 2FA is enabled -- create a token at https://app.docker.com/settings/personal-access-tokens with the Read & Write scope." ;;
          esac

          if [ -z "${DOCKERHUB_REPOSITORY_FROM_VAR}" ]; then
            # Secrets are masked in logs, so the image name will render as ***
            # in every line below -- including the pushed tags in the summary.
            # Works fine, just harder to read.
            echo "::warning::DOCKERHUB_REPOSITORY came from a Secret, so the image name is masked as *** in these logs. Moving it to the Variables tab makes the output readable; it is not a credential."
            echo "pushing to the configured repository (masked)"
          else
            echo "pushing to ${DOCKERHUB_REPOSITORY}"
          fi

      - uses: docker/setup-qemu-action@v3
        if: contains(env.PLATFORMS, 'arm')

      - uses: docker/setup-buildx-action@v3

      - name: Resolve the upstream tag this build sits on
        id: base
        env:
          # Via env, not `${{ }}` inside the script: a ref name is attacker-
          # shaped input for anyone who can push a tag, and interpolating it
          # into shell source is how that becomes command execution.
          INPUT_BASE_TAG: ${{ inputs.base_tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE: docker.io/nousresearch/hermes-agent
        run: |
          set -euo pipefail

          # The whole tag policy, in one place:
          #   push to main / a PR -> upstream `latest`, published as `latest`
          #   push of a `v*` tag  -> upstream's identically named tag,
          #                          published under that same name
          # A manual run can override the first half without touching the git
          # history, which is also the escape hatch for rebuilding an old
          # release against a newer base.
          case "${REF}" in
            refs/tags/*) is_release=true ;;
            *)           is_release=false ;;
          esac

          if [ -n "${INPUT_BASE_TAG}" ]; then
            tag="${INPUT_BASE_TAG}"
          elif [ "${is_release}" = true ]; then
            tag="${REF_NAME}"
          else
            tag="latest"
          fi

          # Resolve now, once. Both builds below -- the one that gets verified
          # and the one that gets pushed -- then reference the same immutable
          # digest, so an upstream push landing between them cannot make us
          # verify one image and ship another. It also turns a typo'd release
          # tag into a named failure here instead of a `manifest unknown` from
          # deep inside a build step ten minutes later.
          if ! digest=$(docker buildx imagetools inspect "${BASE}:${tag}" \
                          --format '{{.Manifest.Digest}}' 2>&1); then
            echo "::error::No such upstream image: ${BASE}:${tag}"
            echo "${digest}"
            if [ "${is_release}" = true ]; then
              echo "::error::A v* git tag is built from the upstream tag of the same name, so ${REF_NAME} must exist at https://hub.docker.com/r/nousresearch/hermes-agent/tags before it can be released here. Delete the tag, or re-run this workflow with base_tag set to an upstream tag that does exist."
            fi
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "digest=${digest}"
            echo "is_release=${is_release}"
          } >> "$GITHUB_OUTPUT"
          echo "building on ${BASE}:${tag} (${digest})"

      # ── Build for the runner's own arch and load it, so the image can
      #    actually be executed by the verify step below. A multi-platform
      #    build produces a manifest list, which `--load` cannot handle, hence
      #    two build steps sharing one cache.
      - name: Build amd64 image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            RTK_SHIM_LEVEL=${{ env.SHIM_LEVEL }}
            HERMES_BASE_TAG=${{ steps.base.outputs.tag }}
            HERMES_BASE_PIN=@${{ steps.base.outputs.digest }}
          tags: hermes-agent-rtk:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the built image
        run: make verify IMAGE=hermes-agent-rtk:ci

      - name: Smoke-test that the container still boots
        run: |
          # `make verify` proves rtk and the shims are right. This proves the
          # hardening did not cost us a working container: the same capability
          # set compose.yaml uses, checked for permission failures during s6
          # init. Boot problems from cap_drop show up here and nowhere else.
          mkdir -p /tmp/ci-data && chmod 777 /tmp/ci-data
          docker run -d --name ci-boot \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE \
            --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --pids-limit 512 \
            -e HERMES_DASHBOARD=1 \
            -e HERMES_DASHBOARD_HOST=0.0.0.0 \
            -e HERMES_DASHBOARD_PORT=9119 \
            -e HERMES_DASHBOARD_BASIC_AUTH_USERNAME=ci \
            -e HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=ci-test-password \
            -e "HERMES_DASHBOARD_BASIC_AUTH_SECRET=$(openssl rand -hex 32)" \
            -e HERMES_WRITE_SAFE_ROOT=/opt/data \
            -v /tmp/ci-data:/opt/data \
            hermes-agent-rtk:ci gateway run

          # s6 init, a config migration and the dashboard bind all happen
          # before anything listens; poll rather than guess at a sleep.
          for i in $(seq 1 30); do
            if docker exec ci-boot /opt/rtk/bin/healthcheck.sh 2>/dev/null; then
              echo "healthcheck passed after ${i}0s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::container never became healthy"
              docker logs ci-boot | tail -50
              exit 1
            fi
            sleep 10
          done

          if docker logs ci-boot 2>&1 | grep -iE "permission denied|operation not permitted" | grep -v shutdownd; then
            echo "::error::capability set is too tight; see the matches above"
            exit 1
          fi
          echo "boot smoke test: OK"

      - name: Collect container logs on failure
        if: failure()
        run: docker logs ci-boot 2>&1 | tail -100 || true

      - name: Tear down the smoke test
        if: always()
        run: docker rm -f ci-boot || true

      # ── Push ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            # A push to main publishes `latest`, built on upstream `latest`.
            type=raw,value=latest,enable={{is_default_branch}}
            # A `v*` git tag publishes that tag verbatim, built on upstream's
            # tag of the same name. Deliberately not `type=semver`: upstream is
            # calver and some tags have four components (v2026.8.16.2), which
            # is not valid semver, so semver patterns would drop them and
            # `{{version}}` would also strip the `v` that upstream uses --
            # breaking the one property this is for, that the two tags match.
            type=ref,event=tag
            # Same rule for a manual run against a tag ref, where `event=tag`
            # does not fire because the event is workflow_dispatch.
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') }}
            # Immutable pointer at the exact commit, on every build.
            type=sha,format=short
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            RTK_SHIM_LEVEL=${{ env.SHIM_LEVEL }}
            HERMES_BASE_TAG=${{ steps.base.outputs.tag }}
            HERMES_BASE_PIN=@${{ steps.base.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ship a signed build record and an SBOM alongside the image. The
          # whole point of pinning the base by digest and the rtk tarball by
          # SHA-256 is knowing what is inside; these make that checkable by
          # whoever pulls it, not just by whoever built it.
          provenance: mode=max
          sbom: true

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Built on \`nousresearch/hermes-agent:${BASE_TAG}\` (\`${BASE_DIGEST}\`)"
            echo
            echo "Platforms: \`${PLATFORMS}\` · shim level: \`${SHIM_LEVEL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
